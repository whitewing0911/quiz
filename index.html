
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학생의 날 기념 학생인권 퀴즈</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f1f5f9;
      font-family: "Noto Sans KR", sans-serif;
      color: #1e293b;
    }

    .container {
      width: 100%;
      max-width: 650px;
      padding: 32px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 12px;
      text-align: center;
      font-size: 28px;
      line-height: 1.5;
    }

    .subtitle {
      margin-bottom: 28px;
      text-align: center;
      color: #64748b;
      line-height: 1.7;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .main-button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .main-button:hover {
      background: #1d4ed8;
    }

    .progress-area {
      margin-bottom: 24px;
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      margin-bottom: 9px;
      color: #64748b;
      font-size: 14px;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      overflow: hidden;
      border-radius: 10px;
      background: #e2e8f0;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: #2563eb;
      transition: width 0.3s;
    }

    .question {
      margin-bottom: 24px;
      font-size: 21px;
      font-weight: bold;
      line-height: 1.65;
      white-space: pre-line;
      word-break: keep-all;
    }

    .hint {
      margin: -12px 0 18px;
      color: #64748b;
      font-size: 14px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .option {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      background: white;
      color: #334155;
      text-align: left;
      font-size: 16px;
      line-height: 1.6;
      cursor: pointer;
      transition: 0.2s;
      word-break: keep-all;
    }

    .option:hover:not(:disabled) {
      border-color: #93c5fd;
      background: #eff6ff;
    }

    .option:disabled {
      cursor: default;
    }

    .option.correct {
      border-color: #16a34a;
      background: #dcfce7;
      color: #166534;
      font-weight: bold;
    }

    .option.wrong {
      border-color: #dc2626;
      background: #fee2e2;
      color: #991b1b;
      font-weight: bold;
    }

    .feedback {
      display: none;
      margin-top: 22px;
      padding: 18px;
      border-radius: 12px;
      line-height: 1.7;
      white-space: pre-line;
      word-break: keep-all;
    }

    .feedback.show {
      display: block;
    }

    .feedback.correct-feedback {
      background: #f0fdf4;
      color: #166534;
    }

    .feedback.wrong-feedback {
      background: #fef2f2;
      color: #991b1b;
    }

    .feedback-title {
      margin-bottom: 6px;
      font-size: 18px;
      font-weight: bold;
    }

    .next-button {
      margin-top: 18px;
    }

    .result-icon {
      margin-bottom: 12px;
      text-align: center;
      font-size: 48px;
    }

    .result-title {
      margin-bottom: 12px;
      text-align: center;
      font-size: 25px;
      font-weight: bold;
    }

    .score {
      margin: 24px 0;
      text-align: center;
      font-size: 48px;
      font-weight: bold;
      color: #2563eb;
    }

    .result-message {
      margin-bottom: 28px;
      text-align: center;
      line-height: 1.8;
      color: #475569;
      white-space: pre-line;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      .container {
        padding: 23px 18px;
      }

      h1 {
        font-size: 23px;
      }

      .question {
        font-size: 19px;
      }

      .option {
        padding: 12px;
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>학생의 날 기념<br>학생인권 퀴즈</h1>
    <p class="subtitle">
      학생의 날과 학생의 권리에 대해 알아보세요!<br>
      총 5문제로 구성되어 있습니다.
    </p>

    <!-- 시작 화면 -->
    <section id="start-screen" class="screen active">
      <p style="text-align:center; line-height:1.8; margin-bottom:28px;">
        문제를 하나씩 풀고 정답을 확인해 보세요.<br>
        마지막 문제까지 풀면 최종 점수를 확인할 수 있습니다.
      </p>
      <button class="main-button" onclick="startQuiz()">문제 시작</button>
    </section>

    <!-- 문제 화면 -->
    <section id="quiz-screen" class="screen">
      <div class="progress-area">
        <div class="progress-text">
          <span id="question-number">1 / 5</span>
          <span id="score-text">현재 점수: 0점</span>
        </div>
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
      </div>

      <div id="question" class="question"></div>
      <div id="hint" class="hint"></div>
      <div id="options" class="options"></div>

      <div id="feedback" class="feedback">
        <div id="feedback-title" class="feedback-title"></div>
        <div id="feedback-text"></div>
      </div>

      <button
        id="next-button"
        class="main-button next-button"
        style="display:none;"
        onclick="nextQuestion()"
      >
        다음 문제
      </button>
    </section>

    <!-- 결과 화면 -->
    <section id="result-screen" class="screen">
      <div class="result-icon" id="result-icon">🎉</div>
      <div class="result-title">퀴즈 완료!</div>
      <div id="final-score" class="score">0 / 5</div>
      <div id="result-message" class="result-message"></div>
      <button class="main-button" onclick="restartQuiz()">다시 풀기</button>
    </section>
  </main>

  <script>
    const questions = [
      {
        question: "Q1. 우리나라에서 학생의 날의 유래가 된 역사적 사건은 무엇일까요?",
        options: [
          "3.1 운동",
          "6.10 민주항쟁",
          "6.25 전쟁",
          "4.19 혁명",
          "광주학생 항일 운동"
        ],
        answer: [4],
        explanation: "학생의 날은 1929년 광주학생 항일 운동에서 유래했습니다."
      },
      {
        question: "Q2. 학생의 날이 오늘날 우리에게 주는 의미로 가장 적절한 것은 무엇일까요?",
        options: [
          "공부를 열심히 해야 한다는 의미",
          "학생은 어른의 말을 잘 따라야 한다는 의미",
          "학생도 사회의 구성원으로서 자신의 생각과 목소리를 낼 수 있다는 의미",
          "선생님 말을 잘 들어야 한다는 의미",
          "학교 규칙을 무조건 지켜야 한다는 의미"
        ],
        answer: [2],
        explanation: "학생도 사회의 구성원으로서 자신의 의견을 표현하고 사회에 참여할 수 있습니다."
      },
      {
        question: "Q3. 학생의 날의 다른 이름은 무엇일까요?",
        options: [
          "학생자주권기념일",
          "학생애국정신기념일",
          "청소년독립정신기념일",
          "학생독립운동기념일",
          "청소년민주항쟁기념일"
        ],
        answer: [3],
        explanation: "학생의 날은 현재 '학생독립운동기념일'이라는 이름으로 기념합니다."
      },
      {
        question: "Q4. 학생의 날은 언제 처음 생겼을까요?",
        options: [
          "1919년",
          "1950년",
          "1953년",
          "1988년",
          "2000년"
        ],
        answer: [2],
        explanation: "1953년 학생의 날이 국가 기념일로 제정되었습니다."
      },
      {
        question: "Q5. 다음 중 학생의 권리에 해당하는 것을 모두 고르시오.",
        hint: "※ 복수 정답입니다. 해당하는 항목을 모두 선택한 뒤 제출하세요.",
        options: [
          "안전한 환경에서 교육받을 권리",
          "자신의 의견을 표현할 권리",
          "선생님의 말을 듣지 않을 권리",
          "차별받지 않을 권리",
          "위의 모든 것"
        ],
        answer: [0, 1, 3],
        explanation: "학생에게는 안전하게 교육받을 권리, 의견을 표현할 권리, 차별받지 않을 권리가 있습니다. 다만 의견 표현의 자유도 다른 사람의 권리와 학교의 정당한 규칙을 고려해야 합니다."
      }
    ];

    let currentQuestion = 0;
    let score = 0;
    let answered = false;
    let selectedOptions = [];

    function showScreen(screenId) {
      document.querySelectorAll(".screen").forEach(screen => {
        screen.classList.remove("active");
      });

      document.getElementById(screenId).classList.add("active");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function startQuiz() {
      currentQuestion = 0;
      score = 0;
      answered = false;
      selectedOptions = [];
      showScreen("quiz-screen");
      showQuestion();
    }

    function showQuestion() {
      answered = false;
      selectedOptions = [];

      const q = questions[currentQuestion];

      document.getElementById("question-number").textContent =
        `${currentQuestion + 1} / ${questions.length}`;

      document.getElementById("score-text").textContent =
        `현재 점수: ${score}점`;

      document.getElementById("progress-fill").style.width =
        `${(currentQuestion / questions.length) * 100}%`;

      document.getElementById("question").textContent = q.question;
      document.getElementById("hint").textContent = q.hint || "";

      const optionsContainer = document.getElementById("options");
      optionsContainer.innerHTML = "";

      q.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.className = "option";
        button.textContent = `${index + 1}. ${option}`;
        button.onclick = () => selectOption(index);
        optionsContainer.appendChild(button);
      });

      const feedback = document.getElementById("feedback");
      feedback.className = "feedback";
      document.getElementById("feedback-title").textContent = "";
      document.getElementById("feedback-text").textContent = "";

      const nextButton = document.getElementById("next-button");
      nextButton.style.display = "none";
      nextButton.textContent =
        currentQuestion === questions.length - 1 ? "결과 확인" : "다음 문제";
    }

    function selectOption(index) {
      if (answered) return;

      const q = questions[currentQuestion];

      // 객관식 단일 선택
      if (currentQuestion !== 4) {
        selectedOptions = [index];
        checkAnswer();
        return;
      }

      // Q5는 복수 선택
      if (selectedOptions.includes(index)) {
        selectedOptions = selectedOptions.filter(item => item !== index);
      } else {
        selectedOptions.push(index);
      }

      const buttons = document.querySelectorAll(".option");

      buttons.forEach((button, i) => {
        button.classList.toggle("correct", selectedOptions.includes(i));
        button.textContent = `${i + 1}. ${q.options[i]}`;
        if (selectedOptions.includes(i)) {
          button.textContent += " ✓";
        }
      });

      showSubmitButton();
    }

    function showSubmitButton() {
      let submitButton = document.getElementById("submit-answer");

      if (!submitButton) {
        submitButton = document.createElement("button");
        submitButton.id = "submit-answer";
        submitButton.className = "main-button next-button";
        submitButton.textContent = "정답 제출";
        submitButton.onclick = checkAnswer;
        document.getElementById("options").after(submitButton);
      }

      submitButton.style.display = "block";
      submitButton.disabled = selectedOptions.length === 0;
      submitButton.style.opacity = selectedOptions.length === 0 ? "0.5" : "1";
    }

    function checkAnswer() {
      if (answered) return;
      if (selectedOptions.length === 0) return;

      answered = true;

      const q = questions[currentQuestion];
      const correctAnswers = [...q.answer].sort((a, b) => a - b);
      const chosenAnswers = [...selectedOptions].sort((a, b) => a - b);

      const isCorrect =
        correctAnswers.length === chosenAnswers.length &&
        correctAnswers.every((value, i) => value === chosenAnswers[i]);

      if (isCorrect) score++;

      const buttons = document.querySelectorAll(".option");

      buttons.forEach((button, i) => {
        button.disabled = true;

        if (q.answer.includes(i)) {
          button.classList.add("correct");
        } else if (selectedOptions.includes(i)) {
          button.classList.add("wrong");
        }

        button.textContent = `${i + 1}. ${q.options[i]}`;

        if (q.answer.includes(i)) {
          button.textContent += " ✓";
        } else if (selectedOptions.includes(i)) {
          button.textContent += " ✕";
        }
      });

      const submitButton = document.getElementById("submit-answer");
      if (submitButton) submitButton.style.display = "none";

      const feedback = document.getElementById("feedback");
      feedback.className = `feedback show ${
        isCorrect ? "correct-feedback" : "wrong-feedback"
      }`;

      document.getElementById("feedback-title").textContent =
        isCorrect ? "정답입니다! 🎉" : "오답입니다.";

      const answerText = q.answer
        .map(i => `${i + 1}번. ${q.options[i]}`)
        .join("\n");

      document.getElementById("feedback-text").textContent =
        (isCorrect ? "" : `정답: ${answerText}\n\n`) + q.explanation;

      document.getElementById("score-text").textContent =
        `현재 점수: ${score}점`;

      document.getElementById("progress-fill").style.width =
        `${((currentQuestion + 1) / questions.length) * 100}%`;

      document.getElementById("next-button").style.display = "block";
      document.getElementById("next-button").scrollIntoView({
        behavior: "smooth",
        block: "nearest"
      });
    }

    function nextQuestion() {
      if (!answered) return;

      currentQuestion++;

      if (currentQuestion < questions.length) {
        showQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      showScreen("result-screen");

      document.getElementById("final-score").textContent =
        `${score} / ${questions.length}`;

      let message = "";

      if (score === 5) {
        message = "완벽합니다!\n학생의 날과 학생의 권리에 대해 잘 알고 있네요.";
        document.getElementById("result-icon").textContent = "🏆";
      } else if (score >= 3) {
        message = "잘했습니다!\n퀴즈를 통해 학생의 날과 학생의 권리를 알아보았어요.";
        document.getElementById("result-icon").textContent = "🎉";
      } else {
        message = "수고했습니다!\n정답과 해설을 다시 읽어 보며 학생의 권리를 알아보세요.";
        document.getElementById("result-icon").textContent = "📚";
      }
    }

    function restartQuiz() {
      const submitButton = document.getElementById("submit-answer");
      if (submitButton) submitButton.remove();

      startQuiz();
    }
  </script>
</body>
</html>
