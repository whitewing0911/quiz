
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학생의 날 기념 학생인권 퀴즈</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
  background: #f2f5fc;
  color: #202b43;
  line-height: 1.7;
}

.container {
  width: min(700px, 92%);
  margin: 0 auto;
  padding: 45px 0;
}

header {
  text-align: center;
  margin-bottom: 28px;
}

.tag {
  display: inline-block;
  background: #e5ecff;
  color: #3157d5;
  padding: 5px 14px;
  border-radius: 30px;
  font-size: 14px;
  font-weight: bold;
}

h1 {
  color: #172554;
  font-size: clamp(27px, 5vw, 38px);
  margin: 12px 0 5px;
  line-height: 1.4;
}

.subtitle {
  color: #68748b;
  margin: 0;
}

.card {
  background: white;
  border: 1px solid #e1e7f0;
  border-radius: 20px;
  padding: clamp(22px, 5vw, 34px);
  box-shadow: 0 8px 28px #243b6510;
}

.screen {
  display: none;
}

.screen.active {
  display: block;
}

.start-screen {
  text-align: center;
  padding: 35px 15px;
}

.emoji {
  font-size: 55px;
  margin-bottom: 10px;
}

.start-screen h2 {
  font-size: 25px;
  margin: 0 0 12px;
  color: #172554;
}

.start-screen p {
  color: #68748b;
  margin: 0 auto 25px;
  max-width: 420px;
}

.button {
  display: inline-block;
  width: 100%;
  border: none;
  border-radius: 12px;
  padding: 14px 20px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: background .15s;
}

.primary {
  background: #3157d5;
  color: white;
}

.primary:hover {
  background: #2446b9;
}

.secondary {
  background: #eaf0ff;
  color: #3157d5;
}

.secondary:hover {
  background: #dce5ff;
}

.question-info {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  margin-bottom: 17px;
}

.question-number {
  background: #3157d5;
  color: white;
  border-radius: 8px;
  padding: 4px 10px;
  font-size: 13px;
  font-weight: bold;
}

.topic {
  font-weight: bold;
  color: #172554;
}

.difficulty {
  margin-left: auto;
  background: #f0f2f7;
  color: #68748b;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 13px;
}

.progress-area {
  margin-bottom: 23px;
}

.progress-label {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: #68748b;
  margin-bottom: 7px;
}

.progress-bar {
  height: 7px;
  background: #e8edf6;
  border-radius: 20px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: #3157d5;
  transition: width .25s;
}

.question-text {
  color: #202b43;
  font-size: clamp(18px, 4vw, 21px);
  line-height: 1.65;
  margin: 0 0 23px;
}

.options {
  display: grid;
  gap: 11px;
}

.option {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  width: 100%;
  padding: 13px;
  border: 1.5px solid #e1e7f0;
  border-radius: 12px;
  background: white;
  color: #202b43;
  text-align: left;
  font-size: 15px;
  line-height: 1.6;
  cursor: pointer;
  transition: .15s;
}

.option:hover:not(:disabled) {
  border-color: #91a8ff;
  background: #f7f9ff;
}

.option:disabled {
  cursor: default;
}

.letter {
  flex-shrink: 0;
  display: inline-flex;
  justify-content: center;
  align-items: center;
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: #eaf0ff;
  color: #3157d5;
  font-weight: bold;
}

.option.correct {
  background: #eaf8f0;
  border-color: #269b65;
  color: #155b40;
}

.option.correct .letter {
  background: #16845b;
  color: white;
}

.option.wrong {
  background: #fff0f0;
  border-color: #d94d58;
  color: #8c2f36;
}

.option.wrong .letter {
  background: #c2414b;
  color: white;
}

.feedback {
  display: none;
  margin-top: 18px;
  padding: 16px;
  border-radius: 12px;
}

.feedback.show {
  display: block;
}

.feedback.good {
  background: #eaf8f0;
  color: #155b40;
}

.feedback.bad {
  background: #fff0f0;
  color: #8c2f36;
}

.feedback-title {
  font-size: 17px;
  font-weight: bold;
  display: block;
  margin-bottom: 5px;
}

.feedback p {
  margin: 0;
}

.next-area {
  margin-top: 22px;
}

.result-screen {
  text-align: center;
}

.result-emoji {
  font-size: 60px;
  margin-bottom: 10px;
}

.result-screen h2 {
  color: #172554;
  font-size: 26px;
  margin: 0;
}

.result-score {
  font-size: 52px;
  font-weight: 900;
  color: #3157d5;
  margin: 12px 0;
  line-height: 1.3;
}

.result-message {
  color: #68748b;
  margin: 0 0 25px;
}

footer {
  text-align: center;
  margin-top: 22px;
  font-size: 13px;
  color: #8992a6;
}

@media (max-width: 480px) {
  .container {
    padding: 25px 0;
  }

  .difficulty {
    margin-left: 0;
  }

  .card {
    border-radius: 16px;
  }
}
</style>
</head>

<body>
<main class="container">

<header>
  <span class="tag">🎓 STUDENT'S DAY</span>
  <h1>학생인권 퀴즈</h1>
  <p class="subtitle">학생의 날을 기념해 학생의 권리에 대해 알아봐요!</p>
</header>

<!-- 시작 화면 -->
<section class="card screen active" id="startScreen">
  <div class="start-screen">
    <div class="emoji">🎓</div>
    <h2>학생인권 퀴즈에 도전하세요!</h2>
    <p>
      총 5문제입니다.<br>
      각 문제의 답을 선택하면 바로 정답을 확인할 수 있어요.<br>
      모든 문제를 풀고 자신의 점수를 확인해 보세요.
    </p>
    <button class="button primary" id="startButton">문제 시작</button>
  </div>
</section>

<!-- 문제 화면 -->
<section class="card screen" id="quizScreen">

  <div class="progress-area">
    <div class="progress-label">
      <span id="progressText">1 / 5 문제</span>
      <span id="progressCount">현재 점수 0점</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <div class="question-info">
    <span class="question-number" id="questionNumber">QUESTION 01</span>
    <span class="topic" id="topic"></span>
    <span class="difficulty" id="difficulty"></span>
  </div>

  <h2 class="question-text" id="questionText"></h2>

  <div class="options" id="options"></div>

  <div class="feedback" id="feedback" aria-live="polite">
    <strong class="feedback-title" id="feedbackTitle"></strong>
    <p id="feedbackText"></p>
  </div>

  <div class="next-area">
    <button class="button primary" id="nextButton" style="display:none">
      다음 문제
    </button>
  </div>
</section>

<!-- 결과 화면 -->
<section class="card screen result-screen" id="resultScreen">
  <div class="result-emoji" id="resultEmoji">🏆</div>
  <h2>퀴즈 완료!</h2>
  <div class="result-score" id="finalScore">5 / 5</div>
  <p class="result-message" id="resultMessage"></p>
  <button class="button primary" id="retryButton">다시 풀기</button>
</section>

<footer>
  서로의 권리를 존중하는 학교, 함께 만들어요.
</footer>

</main>

<script>
const questions = [
  {
    topic: "학생의 기본 권리",
    difficulty: "쉬움",
    question: "다음 중 학생이 학교에서 보장받아야 할 기본적인 권리는 무엇일까요?",
    options: [
      "성적이 높은 학생만 의견을 말할 권리",
      "모든 학생이 차별받지 않고 존중받을 권리",
      "선생님이 허락한 학생만 인권을 보장받을 권리",
      "학교 규칙을 잘 지킨 학생만 인권을 보장받을 권리"
    ],
    answer: 1,
    explanation: "학생은 성적이나 행동에 관계없이 인간으로서 존중받아야 해요. 인권은 특정 학생에게만 주어지는 혜택이 아니에요."
  },
  {
    topic: "표현의 자유",
    difficulty: "쉬움",
    question: "학생이 학교 규칙에 대해 불합리하다고 생각할 때 가장 바람직한 행동은 무엇일까요?",
    options: [
      "무조건 따르고 의견을 말하지 않는다.",
      "규칙을 몰래 어기고 다른 학생에게도 권한다.",
      "근거를 들어 자신의 의견을 정중하게 표현한다.",
      "반대 의견을 가진 학생을 비난한다."
    ],
    answer: 2,
    explanation: "자신의 생각을 근거와 함께 정중하게 표현하고 대화하는 것은 표현의 자유를 책임 있게 행사하는 방법이에요."
  },
  {
    topic: "사생활의 자유",
    difficulty: "보통",
    question: "친구가 다른 학생의 동의 없이 그 학생의 휴대전화 속 사적인 사진을 단체 채팅방에 올렸습니다. 가장 적절한 설명은 무엇일까요?",
    options: [
      "친한 친구 사이에서는 언제나 허용된다.",
      "장난이라면 상대방의 동의는 필요하지 않다.",
      "사진이 재미있다면 누구나 공유할 수 있다.",
      "사생활과 개인정보를 침해할 수 있으므로 동의 없이 공유하지 않아야 한다."
    ],
    answer: 3,
    explanation: "사적인 사진을 동의 없이 공유하면 사생활과 개인정보를 침해할 수 있어요. 친한 사이거나 장난이라는 이유만으로 괜찮아지는 것은 아니에요."
  },
  {
    topic: "차별받지 않을 권리",
    difficulty: "보통",
    question: "학교에서 학생을 대할 때 인권을 존중하는 태도로 가장 적절한 것은 무엇일까요?",
    options: [
      "성적이 낮은 학생에게는 의견을 낼 기회를 적게 준다.",
      "성별이나 장애, 가정환경 등을 이유로 부당하게 차별하지 않는다.",
      "다수의 학생이 싫어하는 학생은 활동에서 제외한다.",
      "학생마다 인권을 보장하는 정도를 성적에 따라 다르게 한다."
    ],
    answer: 1,
    explanation: "모든 학생은 성별, 장애, 가정환경 등을 이유로 부당한 차별을 받아서는 안 돼요. 각자의 차이를 존중하는 태도가 중요해요."
  },
  {
    topic: "인권과 학교 규칙",
    difficulty: "어려움",
    question: "학교가 학생들의 안전과 학습을 위해 규칙을 만들었습니다. 이 규칙이 학생의 인권을 제한할 때, 가장 적절한 판단 기준은 무엇일까요?",
    options: [
      "학교가 만든 규칙이라면 어떤 내용이든 인권보다 우선한다.",
      "학생 다수가 찬성하면 소수 학생의 권리는 제한해도 된다.",
      "교육 목적이 있다면 제한의 정도와 방법은 따질 필요가 없다.",
      "제한의 법적 근거와 정당한 목적이 있는지, 필요한 범위를 넘지 않는지 등을 살펴야 한다."
    ],
    answer: 3,
    explanation: "학교 규칙도 무조건 우선하는 것은 아니에요. 인권 제한에 법적 근거와 정당한 목적이 있는지, 필요한 범위에서 최소한으로 제한하는지 등을 살펴야 해요."
  }
];

const letters = ["A", "B", "C", "D"];
let currentQuestion = 0;
let score = 0;
let answered = false;

const $ = id => document.getElementById(id);

function showScreen(screenId) {
  document.querySelectorAll(".screen").forEach(screen => {
    screen.classList.remove("active");
  });
  $(screenId).classList.add("active");
}

function startQuiz() {
  currentQuestion = 0;
  score = 0;
  answered = false;
  showScreen("quizScreen");
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentQuestion];
  answered = false;

  $("progressText").textContent =
    `${currentQuestion + 1} / ${questions.length} 문제`;
  $("progressCount").textContent = `현재 점수 ${score}점`;
  $("progressFill").style.width =
    `${currentQuestion / questions.length * 100}%`;

  $("questionNumber").textContent =
    `QUESTION ${String(currentQuestion + 1).padStart(2, "0")}`;
  $("topic").textContent = q.topic;
  $("difficulty").textContent = q.difficulty;
  $("questionText").textContent = q.question;
  $("options").innerHTML = "";

  $("feedback").className = "feedback";
  $("feedbackTitle").textContent = "";
  $("feedbackText").textContent = "";
  $("nextButton").style.display = "none";

  q.options.forEach((optionText, index) => {
    const button = document.createElement("button");
    button.className = "option";
    button.type = "button";

    const letter = document.createElement("span");
    letter.className = "letter";
    letter.textContent = letters[index];

    const text = document.createElement("span");
    text.textContent = optionText;

    button.append(letter, text);
    button.addEventListener("click", () => selectAnswer(index));

    $("options").appendChild(button);
  });

  window.scrollTo({ top: 0, behavior: "smooth" });
}

function selectAnswer(index) {
  if (answered) return;

  answered = true;
  const q = questions[currentQuestion];
  const isCorrect = index === q.answer;

  if (isCorrect) score++;

  [...$("options").children].forEach((button, i) => {
    button.disabled = true;

    if (i === q.answer) {
      button.classList.add("correct");
    } else if (i === index) {
      button.classList.add("wrong");
    }
  });

  $("feedback").className =
    `feedback show ${isCorrect ? "good" : "bad"}`;

  $("feedbackTitle").textContent = isCorrect
    ? "정답입니다! 🎉"
    : `오답입니다. 정답은 ${letters[q.answer]}입니다.`;

  $("feedbackText").textContent = q.explanation;

  $("progressCount").textContent = `현재 점수 ${score}점`;
  $("progressFill").style.width =
    `${(currentQuestion + 1) / questions.length * 100}%`;

  const nextButton = $("nextButton");
  nextButton.textContent =
    currentQuestion === questions.length - 1
      ? "결과 확인하기"
      : "다음 문제";
  nextButton.style.display = "block";

  window.setTimeout(() => {
    nextButton.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }, 100);
}

function nextQuestion() {
  if (!answered) return;

  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  showScreen("resultScreen");
  $("finalScore").textContent = `${score} / ${questions.length}`;

  if (score === 5) {
    $("resultEmoji").textContent = "🏆";
    $("resultMessage").textContent =
      "대단해요! 모든 문제를 맞혔어요. 학생인권에 대해 잘 이해하고 있네요.";
  } else if (score >= 3) {
    $("resultEmoji").textContent = "🎉";
    $("resultMessage").textContent =
      `총 5문제 중 ${score}문제를 맞혔어요! 학생인권에 대해 더 알아가는 시간이 되었길 바라요.`;
  } else {
    $("resultEmoji").textContent = "📚";
    $("resultMessage").textContent =
      `총 5문제 중 ${score}문제를 맞혔어요. 서로의 권리를 존중하는 방법을 함께 알아봐요!`;
  }

  window.scrollTo({ top: 0, behavior: "smooth" });
}

$("startButton").addEventListener("click", startQuiz);
$("nextButton").addEventListener("click", nextQuestion);

// 다시 풀기는 새로운 참가자를 위해 점수를 초기화하고 시작 화면으로 돌아갑니다.
$("retryButton").addEventListener("click", () => {
  currentQuestion = 0;
  score = 0;
  answered = false;
  showScreen("startScreen");
  window.scrollTo({ top: 0, behavior: "smooth" });
});

</script>
</body>
</html>
